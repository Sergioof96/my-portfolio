<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sergio Oliver | Desarrollador Web/Telecomunicaciones</title>
  <meta name="description" content="Portfolio de Sergio: proyectos y contacto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <canvas id="dust" aria-hidden="true"></canvas>
  <header class="top" id="top">
    <nav aria-label="Secciones">
      <a href="#cover">Portada</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>
  <section class="cover" id="cover" aria-label="Portada">
    <div class="slides" id="slides" aria-hidden="true"></div>
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="cover-in">
      <h1 id="coverName"></h1>
      <p class="role" id="coverRole"></p>
      <button class="enter" id="enter" type="button">Descubre más sobre mi
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
      </button>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>
  <main>
    <section class="band" id="sobre-mi">
      <div class="inner">
        <h2>Sobre mí</h2>
        <div class="about-grid">
          <div class="about-left">
            <div class="photo" id="photo"></div>
            <div id="about"></div>
          </div>
          <div class="langs" id="langs"></div>
        </div>
      </div>
    </section>
    <section class="band alt" id="proyectos">
      <div class="inner">
        <h2>Proyectos</h2>
        <div class="projects" id="projects"></div>
        <p class="note" id="projectNote"></p>
      </div>
    </section>
    <section class="band" id="contacto">
      <div class="inner">
        <h2>Contacto</h2>
        <div id="contact"></div>
      </div>
    </section>
  </main>
  <footer class="site-foot">
    <a class="up" href="#cover" aria-label="Volver arriba">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7" />
      </svg>
    </a>
    <div class="links" id="links"></div>
    <p id="foot"></p>
  </footer>

  <script src="src/script.js"></script>
</body>

</html>
